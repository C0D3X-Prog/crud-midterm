services:
  app:
    build: .
    container_name: crud-app
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_USER: mit001
      DB_PASSWORD: mit001
      DB_NAME: crud_db
      DB_PORT: 3306
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: crud-db
    environment:
      MYSQL_DATABASE: crud_db
      MYSQL_USER: mit001
      MYSQL_PASSWORD: mit001
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mit001", "-pmit001"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
